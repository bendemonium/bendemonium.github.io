<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/components/navbar.js" defer></script>
    <script src="assets/components/name.js"></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ridhi bandaru >:-]</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: 'Calibri Light', Calibri, Arial, sans-serif;
			font-weight: 300;
			display: flex;
			color: #000;
		}
		.main-content {
			margin-left: 80px;
			padding: 40px;
			width: calc(100% - 60px);
            font-family: Helvetica, Arial, sans-serif;
		}
	</style>
</head>
<body>
	<nav-bar></nav-bar>
	<div class="main-content">
		<name-bar></name-bar>
        <div style="position:sticky;top:0;">
            <nav id="hbar" style="display:flex;gap:12px;align-items:center;padding: 0px 12px;font-family:Helvetica,Arial,sans-serif;">
                <button data-target="s1" style="border:none;padding:6px 10px;cursor:pointer;font-weight:400; background: hsla(0, 0%, 100%, 0);">[authored]</button>
                <button data-target="s2" style="border:none;padding:6px 10px;cursor:pointer;font-weight:400; background: hsla(0, 0%, 100%, 0);">[been acknowledged]</button>
            </nav>
        </div>
        <div id="stage" style="position:relative;">
            <section id="s1" style="position:absolute;inset:0;padding:24px;box-sizing:border-box;display:block;">
                <div class="pub-box" style="width: 90%; max-width: 9in; color: #000; padding: 16px; ">
                        <div style="width: 100%; box-sizing: border-box;">
                            <ul id="pub-list" style="list-style: none; padding: 0; margin: 0; font-size: 0.9em; font-family: 'Calibri Light', Helvetica, Calibri, Arial, sans-serif;"></ul>
                        </div>
                    </div>
            </section>
            <section id="s2" style="position:absolute;inset:0;padding:24px;box-sizing:border-box;display:none;">
                <div class="pub-box" style="width: 90%; max-width: 9in; color: #000; padding: 16px; ">
                        <div style="width: 100%; box-sizing: border-box;">
                            <ul id="ack-list" style="list-style: none; padding: 0; margin: 0; font-size: 0.9em; font-family: 'Calibri Light', Helvetica, Calibri, Arial, sans-serif;"></ul>
                        </div>
                    </div>
            </section>
        </div>
        </div>
	</div>
</body>
</html>

<script>
  const MyName = "Ridhi Bandaru"; // stays bold

  fetch('assets/publications.json')
    .then(r => r.json())
    .then(items => {
      const list = document.getElementById('pub-list');
      items.sort((a, b) => (b.year || 0) - (a.year || 0));

      items.forEach(p => {
        const li = document.createElement('li');
        li.style.marginBottom = '14px';

        // --- Title (clickable if link given) ---
        const titleHTML = p.link
          ? `<a href="${p.link}" target="_blank" style="color:#000; text-decoration:underline; font-size:1em; font-weight:600;">${p.title}</a>`
          : `<span style="font-size:1em; font-weight:500;">${p.title}</span>`;

        // --- Year & Status inline with title ---
        const metaText = [p.status, p.year].filter(Boolean).join(', ');
        const metaHTML = metaText
          ? `<span style="font-style:italic; color:#555; font-size:0.9em; margin-left:6px;">${metaText}</span>`
          : '';

        // --- Resource links [code / demo / slides / talk] ---
        const resourceLinks = [];
        if (p.code) resourceLinks.push(`<a href="${p.code}" target="_blank" style="color:#000; text-decoration:underline;">code</a>`);
        if (p.demo) resourceLinks.push(`<a href="${p.demo}" target="_blank" style="color:#000; text-decoration:underline;">demo</a>`);
        if (p.slides) resourceLinks.push(`<a href="${p.slides}" target="_blank" style="color:#000; text-decoration:underline;">slides</a>`);
        if (p.talk) resourceLinks.push(`<a href="${p.talk}" target="_blank" style="color:#000; text-decoration:underline;">talk</a>`);
        const resourcesHTML = resourceLinks.length
          ? `<div style="font-size:0.9em; color:#555;">[ ${resourceLinks.join(' / ')} ]</div>`
          : '';

        // --- Authors ---
        const authorsHTML = (p.authors || '').replaceAll(
          MyName,
          `<span style="font-weight:500;">${MyName}</span>`
        );

        // --- Venue ---
        const venueLine = (p.venue || p.journal || p.conference)
          ? `<div><em>${p.venue || p.journal || p.conference}</em></div>`
          : '';

        li.innerHTML = `
          <div>${titleHTML}${metaHTML}</div>
          <div>${authorsHTML}</div>
          ${venueLine}
          ${resourcesHTML}
        `;

        list.appendChild(li);
      });
    })
    .catch(err => console.error('Error loading papers.json:', err));
</script>

<script>
  const buttons = [...document.querySelectorAll('#hbar button')];
  const panels  = [...document.querySelectorAll('#stage section')];

  function show(id, updateHash = true) {
    // toggle panels
    panels.forEach(p => p.style.display = p.id === id ? 'block' : 'none');

    // style active button
    buttons.forEach(b => {
      if (b.dataset.target === id) {
        b.style.textDecoration = 'underline';
      } else {
        b.style.textDecoration = 'none';
      }
    });

    // update hash and focus
    if (updateHash) history.replaceState(null, '', '#' + id);
    const h = document.querySelector('#' + id + ' h2');
    if (h) h.setAttribute('tabindex', '-1'), h.focus({ preventScroll: true });
  }

  buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.target)));

  window.addEventListener('load', () => {
    const id = location.hash.slice(1);
    show(panels.some(p => p.id === id) ? id : panels[0].id, false);
  });
</script>
