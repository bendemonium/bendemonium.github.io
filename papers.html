<!DOCTYPE html>
<html lang="en">
<head>
    <script src="components/navbar.js" defer></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bendemonium</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: 'Calibri Light', Calibri, Arial, sans-serif;
			font-weight: 300;
			display: flex;
			color: #000;
		}
		.main-content {
			margin-left: 80px;
			padding: 40px;
			width: calc(100% - 60px);
		}
	</style>
</head>
<body>
	<nav-bar></nav-bar>
	<div class="main-content">
		<div style="margin-bottom: 16px;">
			<div style="font-size: 2.7em; font-weight: 500; font-family: 'Calibri Light', Helvetica, Arial, sans-serif;">Ridhi Bandaru</div>
			<div style="font-size: 1.6em; font-weight: 400; font-family: 'Calibri Light', Helvetica, Arial, sans-serif; margin-top: 2px;">/rɪdʱiː bəŋɖaːɾuː/ </div>
			<!-- <div style="font-size: 1em; font-weight: 50; font-family: 'Calibri Light', Calibri, Arial, sans-serif; margin-top: 2px;"><i>ri-dee ban-der-oo</i></div> -->
		</div>
       <div class="pub-box" style="width: 90%; max-width: 9in; background: #ffffff; color: #000; padding: 16px; margin: 24px 0;">

            <div style="max-height: 200px; overflow-y: auto; width: 100%; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #f1f1f1 #000;">
                <ul id="pub-list" style="list-style: none; padding: 0; margin: 0; font-size: 0.9em; font-family: 'Calibri Light', Calibri, Arial, sans-serif;"></ul>
            </div>
        </div>
        </div>
	</div>
</body>
</html>

<script>
  const MyName = "Ridhi Bandaru"; // stays bold

  fetch('assets/publications.json')
    .then(r => r.json())
    .then(items => {
      const list = document.getElementById('pub-list');
      items.sort((a, b) => (b.year || 0) - (a.year || 0));

      items.forEach(p => {
        const li = document.createElement('li');
        li.style.marginBottom = '14px';

        // --- Title (clickable if link given) ---
        const titleHTML = p.link
          ? `<a href="${p.link}" target="_blank" style="color:#000; text-decoration:underline; font-size:1.1em; font-weight:600;">${p.title}</a>`
          : `<span style="font-size:1.1em; font-weight:600;">${p.title}</span>`;

        // --- Year & Status inline with title ---
        const metaText = [p.status, p.year].filter(Boolean).join(', ');
        const metaHTML = metaText
          ? `<span style="font-style:italic; color:#555; font-size:0.9em; margin-left:6px;">${metaText}</span>`
          : '';

        // --- Resource links [code / demo / slides / talk] ---
        const resourceLinks = [];
        if (p.code) resourceLinks.push(`<a href="${p.code}" target="_blank" style="color:#000; text-decoration:underline;">code</a>`);
        if (p.demo) resourceLinks.push(`<a href="${p.demo}" target="_blank" style="color:#000; text-decoration:underline;">demo</a>`);
        if (p.slides) resourceLinks.push(`<a href="${p.slides}" target="_blank" style="color:#000; text-decoration:underline;">slides</a>`);
        if (p.talk) resourceLinks.push(`<a href="${p.talk}" target="_blank" style="color:#000; text-decoration:underline;">talk</a>`);
        const resourcesHTML = resourceLinks.length
          ? `<div style="font-size:0.85em; color:#555;">[ ${resourceLinks.join(' / ')} ]</div>`
          : '';

        // --- Authors ---
        const authorsHTML = (p.authors || '').replaceAll(
          MyName,
          `<span style="font-weight:600;">${MyName}</span>`
        );

        // --- Venue ---
        const venueLine = (p.venue || p.journal || p.conference)
          ? `<div><em>${p.venue || p.journal || p.conference}</em></div>`
          : '';

        li.innerHTML = `
          <div>${titleHTML}${metaHTML}</div>
          <div>${authorsHTML}</div>
          ${venueLine}
          ${resourcesHTML}
        `;

        list.appendChild(li);
      });
    })
    .catch(err => console.error('Error loading papers.json:', err));
</script>
