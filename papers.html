<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/components/navbar.js" defer></script>
    <script src="assets/components/name.js"></script>
    <script src="assets/components/aside.js" defer></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ridhi bandaru >:-]</title>
	<link rel="icon" type="image/x-icon" href="assets/favicon.png">
	<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
	<nav-bar></nav-bar>
	<div class="page-body">
	<div class="main-content">
		<name-bar></name-bar>
        <div class="pub-box" style="width: 90%; max-width: 9in; color: #000; padding-left: 0; padding-top: 20px; ">
                <div style="width: 100%; box-sizing: border-box;">
                    <ul id="pub-list" style="list-style: none; padding: 0px; margin: 0; font-size: 0.9em; font-family: Helvetica, Calibri, Arial, sans-serif;"></ul>
                </div>
            </div>
	</div>
	<page-aside></page-aside>
	</div>
</body>
</html>

<script>
  const MyName = "Ridhi Bandaru"; // stays bold

  fetch('assets/publications.json')
    .then(r => r.json())
    .then(items => {
      const list = document.getElementById('pub-list');
      
      // Define status order
      const statusOrder = { "in prep": 1, "under review": 2, "in press": 3 };
      const visibleItems = items.filter(p => p.show !== false);
      
      visibleItems.sort((a, b) => {
        const statusA = statusOrder[a.status?.toLowerCase()] || 4;
        const statusB = statusOrder[b.status?.toLowerCase()] || 4;
        if (statusA !== statusB) return statusA - statusB;
        return (b.year || 0) - (a.year || 0);
      });

      visibleItems.forEach(p => {
        const li = document.createElement('li');
        li.style.cssText = 'display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;';

        // --- Title (clickable if link given) ---
        const titleHTML = p.link
          ? `<a href="${p.link}" target="_blank" style="color:#000; text-decoration:underline; font-size:12.5px; font-weight:400;">${p.title}</a>`
          : `<span style="font-size:12.5px; font-weight:400;">${p.title}</span>`;

        // --- Type in square brackets ---
        const typeHTML = p.type ? ` <span style="font-size:9px; font-weight:300;">[${p.type}]</span>` : '';

        // --- Year & Status: right-aligned column to the left of the title ---
        const metaText = [p.status, p.year].filter(Boolean).join(', ');
        const metaHTML = `<div style="width: 64px; flex-shrink: 0; text-align: right; font-style: italic; color: #555; font-size: 10.5px;">${metaText}</div>`;

        // --- Links ---
        const links = [];
        if (p.links) {
          for (const [name, url] of Object.entries(p.links)) {
            links.push(`<a href="${url}" target="_blank" style="color:#000; text-decoration:underline;">${name}</a>`);
          }
        }
        const linksHTML = links.length
          ? `<span style="font-size:10px; color:#555;">&lt ${links.join(' / ')} &gt</span>`
          : '';

        // --- Authors ---
        const formatAuthors = (authors) => {
          const parts = authors.split(', ');
          if (parts.length === 1) return authors;
          return parts.slice(0, -1).join(', ') + ' & ' + parts[parts.length - 1];
        };
        const authorsHTML = `<span style="font-size:11.5px">${formatAuthors(p.authors || '').replaceAll(
          MyName,
          `<span style="font-weight:500;">${MyName}</span>`
        )}</span>`;

        // --- Venue ---
        const venueLine = (p.venue || p.journal || p.conference)
? `<span style="font-size:11px;\"><em>${p.venue || p.journal || p.conference}</em> ${p.awards ? ` <span style="font-size:8px; color:#777;">${p.awards}</span>` : ''}</span>`
          : '';

        // Title sets the left edge; authors/venue/links line up beneath it.
        li.innerHTML = `
          ${metaHTML}
          <div style="flex: 1; min-width: 0;">
            <div>${titleHTML}${typeHTML}</div>
            <div>${authorsHTML}</div>
            <div>${venueLine}</div>
            <div>${linksHTML}</div>
          </div>
        `;

        list.appendChild(li);
      });
    })
    .catch(err => console.error('Error loading publications.json:', err));
</script>
