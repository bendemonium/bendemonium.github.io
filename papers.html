<script>
  const MyName = "Ridhi Bandaru"; // stays bold

  fetch('assets/publications.json')
    .then(r => r.json())
    .then(items => {
      const list = document.getElementById('pub-list');
      
      // Define status order
      const statusOrder = { "in prep": 1, "under review": 2, "in press": 3 };
      
      items.sort((a, b) => {
        const statusA = statusOrder[a.status?.toLowerCase()] || 4;
        const statusB = statusOrder[b.status?.toLowerCase()] || 4;
        if (statusA !== statusB) return statusA - statusB;
        return (b.year || 0) - (a.year || 0);
      });

      items.forEach(p => {
        const li = document.createElement('li');
        li.style.marginBottom = '10px';

        // --- Title (clickable if link given) ---
        const titleHTML = p.link
          ? `<a href="${p.link}" target="_blank" style="color:#000; text-decoration:underline; font-size:0.95em; font-weight:400;">${p.title}</a>`
          : `<span style="font-size:0.95em; font-weight:400;">${p.title}</span>`;

        // --- Type in square brackets ---
        const typeHTML = p.type ? ` <span style="font-size:0.9em; font-weight:300;">[${p.type}]</span>` : '';

        // --- Year & Status inline with title ---
        const metaText = [p.status, p.year].filter(Boolean).join(', ');
        const metaHTML = metaText
          ? `<span style="font-style:italic; color:#555; font-size:0.9em; margin-left:6px;">${metaText}</span>`
          : '';

        // --- Links ---
        const links = [];
        if (p.links) {
          for (const [name, url] of Object.entries(p.links)) {
            links.push(`<a href="${url}" target="_blank" style="color:#000; text-decoration:underline;">${name}</a>`);
          }
        }
        const linksHTML = links.length
          ? `<div style="font-size:0.8em; color:#555;">&lt ${links.join(' / ')} &gt</div>`
          : '';

        // --- Authors ---
        const authorsHTML = `<span style="font-size:0.9em">${(p.authors || '').replaceAll(
          MyName,
          `<span style="font-weight:500;">${MyName}</span>`
        )}</span>`;

        // --- Venue ---
        const venueLine = (p.venue || p.journal || p.conference)
? `<div style="font-size:0.9em;\"><em>${p.venue || p.journal || p.conference}</em>${p.awards ? ` <span style="font-size:0.8em; color:#777;">${p.awards}</span>` : ''}</div>`
          : '';

        li.innerHTML = `
          <div>${titleHTML}${typeHTML}${metaHTML}</div>
          <div>${authorsHTML}</div>
          ${venueLine}
          ${linksHTML}
        `;

        list.appendChild(li);
      });
    })
    .catch(err => console.error('Error loading publications.json:', err));
</script>

<script>
  const buttons = [...document.querySelectorAll('#hbar button')];
  const panels  = [...document.querySelectorAll('#stage section')];

  function show(id, updateHash = true) {
    // toggle panels
    panels.forEach(p => p.style.display = p.id === id ? 'block' : 'none');

    // style active button
    buttons.forEach(b => {
      if (b.dataset.target === id) {
        b.style.textDecoration = 'underline';
      } else {
        b.style.textDecoration = 'none';
      }
    });

    // update hash and focus
    if (updateHash) history.replaceState(null, '', '#' + id);
    const h = document.querySelector('#' + id + ' h2');
    if (h) h.setAttribute('tabindex', '-1'), h.focus({ preventScroll: true });
  }

  buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.target)));

  window.addEventListener('load', () => {
    const id = location.hash.slice(1);
    show(panels.some(p => p.id === id) ? id : panels[0].id, false);
  });
</script>
