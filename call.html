<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/components/navbar.js" defer></script>
  <script src="assets/components/name.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ridhi bandaru >:-]</title>
  <style>
    body { margin:0; padding:0; font-family:'Calibri Light', Helvetica, Calibri, Arial, sans-serif; font-weight:300; display:flex; color:#000; }
    .main-content { margin-left:80px; padding:40px; width:calc(100% - 60px); }
  </style>
</head>
<body>
  <nav-bar></nav-bar>
  <div class="main-content">
    <name-bar></name-bar>

    <div class="callout-box" style="max-width: 8.5in; background:#fdfdfd; color:#000; padding:16px; margin:24px 0; width: 80%;">

      <!-- Invisible target prevents navigation after submit -->
      <iframe name="gform_target" style="display:none;"></iframe>

      <!-- CHANGE action="" to your Google Forms formResponse URL -->
      <form id="callout-form"
            action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSekC7WGBtcGzmhX8ojGS4gRQ88IXfUdQFDzHDbhYBYNq5Dulw/formResponse"
            method="POST"
            target="gform_target"
            style="font-size:0.95em;">

        <!-- Message (optional) — map to its entry.* id -->
        <textarea id="co-message" name="entry.1133441615" rows="1"
          placeholder="critique, feedback, call-out…"
          style="width:100%; box-sizing:border-box; padding:10px; border:none; background:#fff; color:#000;"></textarea>

        <!-- Name (optional) -->
        <label for="co-name" style="display:block; margin:12px 0 4px;">name/sobriquet</label>
        <input id="co-name" name="entry.1917455426" type="text" placeholder="humpty dumpty"
          style="width:100%; box-sizing:border-box; padding:10px; border:none; background:#fff; color:#000;">

        <!-- Email (optional) -->
        <label for="co-email" style="display:block; margin:12px 0 4px;">email</label>
        <input id="co-email" name="entry.169518598" type="email" placeholder="hdumpty@worstfall.ever"
          style="width:100%; box-sizing:border-box; padding:10px; border:none; background:#fff; color:#000;">

        <!-- Checkboxes (optional) -->
        <div style="margin:14px 0 10px;">
          <label style="display:flex; align-items:self-start; gap:8px; margin:6px 0;">
            <!-- Map to the entry id of the “conversation?” question.
                 For Google checkbox/multiple-choice, the value must match the choice text in your Form (e.g., "Yes"). -->
            <input type="checkbox" name="entry.339940278" value="yes">
            <div style="display:flex; flex-direction:column; gap:4px;">
              <span>are you looking to have a conversation?</span>
              <span style="font-size:12px; color:#494949;">
                (this means I will reply to you so please provide an email@)
              </span>
            </div>
          </label>

          <label style="display:flex; align-items:self-start; gap:8px; margin:6px 0;">
            <!-- Map to the entry id of the “educate me?” question -->
            <input type="checkbox" name="entry.1083481839" value="yes">
            <div style="display:flex; flex-direction:column; gap:4px;">
              <span>do you want to educate me?</span>
              <span style="font-size:12px; color:#494949;">
                (I'm happy to actively find resources online/talk to other people, but if it's something that's not widely covered or is 
                specific/nuanced, I’d really appreciate your time! Also, it’s not your job and can be exhausting, so please do not feel obligated -- I will 
                do my best to educated myself regardless.)
              </span>
            </div>
          </label>
        </div>

        <button type="submit" style="background:#000; font-weight:600; color:#d7d5d5; cursor:pointer;">send</button>
      </form>

      <!-- Thank-you message -->
      <div id="callout-thanks" style="display:none; margin-top:8px;">
        <div style="padding:10px 0;">thank you for that — I appreciate you taking the time.</div>
      </div>
    </div>
  </div>
</body>
</html>

<script>
  // Auto-resize the textarea (expand + shrink)
  (function(){
    const ta = document.getElementById('co-message');
    function autoResize(el){ el.style.height='auto'; el.style.height = el.scrollHeight + 'px'; }
    ta.addEventListener('input', () => autoResize(ta));
    window.addEventListener('load', () => autoResize(ta));
  })();

  // Swap to thank-you after Google receives the submission (iframe load)
  (function(){
    const form = document.getElementById('callout-form');
    const thanks = document.getElementById('callout-thanks');
    const iframe = document.getElementsByName('gform_target')[0];

    iframe.addEventListener('load', () => {
      // Hide the form and show the thank-you
      form.style.display = 'none';
      thanks.style.display = 'block';
    });
  })();
</script>
